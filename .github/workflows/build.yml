name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon 2>&1 | tee build.log
      - if: failure()
        run: grep -E "^e: " build.log | head -20 | while read -r l; do echo "::error::$l"; done
      - uses: actions/upload-artifact@v4
        with:
          name: TrackIt-apk
          path: app/build/outputs/apk/debug/app-debug.apk
